# Chemistry-driven material clusters for Phase 1. Each cluster expands to one
# or more Materials Project queries so materials interrelate through shared
# elements, crystal systems, and property classes rather than forming
# isolated islands. Targets ~500-2000 total materials after cross-cluster
# dedup (see docs/PHASE1_PLAN.md for the original 10-material rationale this
# generalizes).
#
# Query patterns (implemented in mp_client.py):
#   elements_plus_fixed        - for each element in `vary`, query
#                                 elements=<fixed + vary_element>, capped at
#                                 nelements_max total elements.
#   pairwise_chemsys           - binary compounds: chemsys=<a>-<b> for every
#                                 (a, b) in group_a x group_b.
#   pairwise_chemsys_with_suffix - ternary compounds: chemsys=<a>-<b>-<suffix>
#                                 for every (a, b) in group_a x group_b (a != b).
#   chemsys_list                - literal chemsys strings, queried together.
#
# Every query also applies energy_above_hull_max (stability filter) and
# exclude_elements (radioactive/synthetic elements dropped globally below),
# and keeps at most limit_per_query results per sub-query, sorted by
# energy_above_hull ascending (most stable first).
clusters:
  - name: battery_cathode_oxide
    pattern: elements_plus_fixed
    fixed: [Li, O]
    vary: [Fe, Co, Mn, Ni, V, Ti, Cr, Zn, Cu, Sc, Nb, Mo]
    nelements_max: 3
    energy_above_hull_max: 0.08
    limit_per_query: 25

  - name: battery_cathode_phosphate
    pattern: elements_plus_fixed
    fixed: [Li, P, O]
    vary: [Fe, Mn, Co, Ni, V, Ti, Cr]
    nelements_max: 4
    energy_above_hull_max: 0.08
    limit_per_query: 25

  - name: semiconductor_iii_v
    pattern: pairwise_chemsys
    group_a: [B, Al, Ga, In]
    group_b: [N, P, As, Sb]
    energy_above_hull_max: 0.08
    limit_per_query: 20

  - name: semiconductor_ii_vi
    pattern: pairwise_chemsys
    group_a: [Zn, Cd, Hg]
    group_b: [O, S, Se, Te]
    energy_above_hull_max: 0.08
    limit_per_query: 20

  - name: semiconductor_group_iv
    pattern: chemsys_list
    chemsys: [Si, Ge, C, Sn, C-Si, Si-Ge, Si-Sn, Ge-Sn]
    energy_above_hull_max: 0.15
    limit_per_query: 30

  - name: oxide_binary
    pattern: elements_plus_fixed
    fixed: [O]
    vary: [Ti, Zn, Sn, Nb, Ta, Zr, Hf, W, Mo, V, Ce, Fe, Mn, Co, Ni, Cr, Cu,
           Al, Ga, In, Bi, Sb, Pb, Ba, Sr, Ca, Mg, Li, Na, K, Sc, Y, La, Si, Ge]
    nelements_max: 2
    energy_above_hull_max: 0.08
    limit_per_query: 20

  - name: perovskite_oxide
    pattern: pairwise_chemsys_with_suffix
    group_a: [Ba, Sr, Pb, Ca, K, Na]
    group_b: [Ti, Zr, Nb, Hf, Sn, Ta]
    suffix: O
    energy_above_hull_max: 0.08
    limit_per_query: 15

  - name: magnetic_spinel_oxide
    pattern: pairwise_chemsys_with_suffix
    group_a: [Fe, Co, Ni, Mn, Cr]
    group_b: [Fe, Co, Ni, Mn, Cr, Zn, Ti]
    suffix: O
    energy_above_hull_max: 0.08
    limit_per_query: 12

# Applied to every cluster query: drops radioactive/synthetic elements that
# would add scientifically uninteresting clutter to the graph.
exclude_elements:
  [Tc, Pm, Po, At, Rn, Fr, Ra, Ac, Th, Pa, U, Np, Pu, Am, Cm, Bk, Cf, Es, Fm, Md, "No", Lr]

# Band-gap buckets (DFT-computed gaps from MP are systematically underestimated
# relative to experiment, so thresholds are tuned for DFT-scale values).
band_gap_buckets:
  - name: metal
    max: 0.0            # band_gap == 0
  - name: narrow_gap
    min: 0.0
    max: 1.0
  - name: semiconductor
    min: 1.0
    max: 3.0
  - name: wide_gap
    min: 3.0

# Thermodynamic stability buckets (energy above hull, eV/atom).
stability_buckets:
  - name: stable
    max: 1.0e-6
  - name: metastable
    min: 1.0e-6
    max: 0.05
  - name: unstable
    min: 0.05

# Application domain rules. A material can match several; every rule that fires
# stores its `rule` text on the suitable_for edge, which is the graph's audit
# trail - the stored justification must always describe what the code did.
#
# Each rule's thresholds live in `params` next to the text that describes them,
# so a number cannot be changed without the human-readable rule being right
# there to update too. The predicate implementing each domain lives in
# APPLICATION_RULE_PREDICATES in src/matgraph/enrich.py; a startup check asserts
# the two lists name exactly the same domains, so neither can drift alone.
#
# On thresholds generally: these are *screening* criteria, not verdicts. A
# material qualifying for `photovoltaic_absorber` is a candidate worth
# examining, not a proven solar cell. Band gaps are DFT values and are
# systematically underestimated relative to experiment, so gap-based windows
# are set for DFT-scale numbers.
application_rules:
  - domain: battery_cathode
    rule: "contains Li and a transition metal, and energy_above_hull <= 0.05 eV/atom"
    params:
      max_energy_above_hull: 0.05

  - domain: semiconductor_device
    rule: "0 < band_gap <= 3.5 eV and not metallic"
    params:
      max_band_gap: 3.5

  - domain: photocatalyst
    rule: "contains O and 1.5 <= band_gap <= 3.5 eV"
    params:
      min_band_gap: 1.5
      max_band_gap: 3.5

  - domain: dielectric
    rule: "band_gap > 2 eV and |total_magnetization| < 0.1 (non-magnetic)"
    params:
      min_band_gap: 2.0
      max_magnetization: 0.1

  - domain: magnetic_material
    rule: "magnetic ordering in {FM, FiM, AFM} and |total_magnetization| >= 0.1, or AFM ordering"
    params:
      min_magnetization: 0.1

  # --- domains added in the Tier 4 coverage pass -------------------------
  # Phase 2 retrieval can only answer questions the graph encodes, so these
  # widen what a query can ask for. Every one is computable from fields already
  # cached - no additional API calls.

  - domain: photovoltaic_absorber
    rule: >-
      direct band gap between 1.0 and 1.8 eV and not metallic (a direct gap
      near the Shockley-Queisser optimum, so the material can absorb sunlight
      strongly in a thin layer)
    params:
      min_band_gap: 1.0
      max_band_gap: 1.8

  # Piezoelectricity and ferroelectricity are permitted or forbidden by the
  # crystal's point group as a matter of physical law - not by a fitted
  # threshold. That makes these the most rigorous rules in the set. They screen
  # on symmetry (see config/space_groups.json), so they say a material *may*
  # be piezoelectric, never that it is.
  - domain: piezoelectric
    rule: >-
      non-centrosymmetric space group excluding point group 432 (so symmetry
      permits a piezoelectric response) and not metallic (a conductor screens
      out the internal field)
    params: {}

  - domain: ferroelectric
    rule: >-
      polar space group (so a spontaneous polarisation can exist along the
      unique axis) and not metallic
    params: {}

  - domain: thermoelectric
    rule: >-
      narrow band gap between 0.1 and 0.8 eV and not metallic - wide enough to
      suppress the minority carriers that cancel thermopower, narrow enough to
      stay conductive
    params:
      min_band_gap: 0.1
      max_band_gap: 0.8

  - domain: uv_transparent
    rule: >-
      band gap >= 4.0 eV and |total_magnetization| < 0.1, so the material does
      not absorb ultraviolet light and has no magnetic absorption channels
    params:
      min_band_gap: 4.0
      max_magnetization: 0.1

  # The two rules below depend on elastic and dielectric data, which Materials
  # Project has computed for only ~18% and ~20% of these materials. A material
  # without that data simply cannot match - absence of the edge means "not
  # known", not "not suitable".
  - domain: hard_structural
    rule: >-
      shear modulus >= 100 GPa and bulk modulus >= 150 GPa (Voigt-Reuss-Hill
      averages) - resists both shape change and compression
    params:
      min_shear_modulus_vrh: 100.0
      min_bulk_modulus_vrh: 150.0

  - domain: high_k_dielectric
    rule: >-
      total dielectric constant >= 20 and band gap > 2 eV - stores charge
      strongly while remaining insulating
    params:
      min_dielectric_total: 20.0
      min_band_gap: 2.0

# Elements considered "transition metals" for the battery_cathode rule.
transition_metals:
  [Sc, Ti, V, Cr, Mn, Fe, Co, Ni, Cu, Zn, Y, Zr, Nb, Mo, Tc, Ru, Rh, Pd, Ag, Cd]

# similar_to edges: for each material, its top_k nearest neighbours by cosine
# similarity over a 10-dimensional z-scored property vector spanning electronic,
# thermodynamic, structural-density, magnetic, mechanical and dielectric
# behaviour. The exact field list, and the reasoning for every field included
# and excluded, lives above SIMILARITY_FIELDS in src/matgraph/enrich.py.
#
# top_k rather than a flat global cutoff: a single cosine threshold produces
# tens of thousands of "similar enough" pairs at a few hundred materials, which
# makes similar_to noise. Top-K keeps edge density meaningful at any scale.
similarity:
  min_edge_weight: 0.6
  top_k: 5
